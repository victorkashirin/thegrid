name: Clean up stale deployments

on:
  workflow_run:
    workflows:
      - pages-build-deployment
      - pages build and deployment
    types: [completed]

permissions:
  actions: write
  contents: read
  deployments: write

concurrency:
  group: cleanup-pages-deployments
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'gh-pages'
    runs-on: ubuntu-latest

    steps:
      - name: Delete inactive GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment: 'github-pages',
                per_page: 100,
              },
            );

            deployments.sort(
              (left, right) => new Date(right.created_at) - new Date(left.created_at),
            );

            if (deployments.length <= 1) {
              core.info('No stale GitHub Pages deployments to delete.');
              return;
            }

            const [currentDeployment, ...staleDeployments] = deployments;
            core.info(`Preserving deployment ${currentDeployment.id}.`);

            let deleted = 0;
            for (const deployment of staleDeployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1,
              });

              if (statuses[0]?.state !== 'inactive') {
                core.warning(
                  `Skipping deployment ${deployment.id}: latest state is ${statuses[0]?.state ?? 'unknown'}.`,
                );
                continue;
              }

              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id,
              });
              deleted += 1;
            }

            core.notice(`Deleted ${deleted} stale GitHub Pages deployment(s).`);

      - name: Delete old site workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const managedWorkflowPaths = new Set([
              '.github/workflows/deploy.yml',
              '.github/workflows/cleanup-deployments.yml',
              'dynamic/pages/pages-build-deployment',
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              },
            );

            const completedRuns = runs
              .filter(
                (run) =>
                  run.status === 'completed' && managedWorkflowPaths.has(run.path),
              )
              .sort(
                (left, right) => new Date(right.created_at) - new Date(left.created_at),
              );

            const newestCompletedRunByWorkflow = new Map();
            for (const run of completedRuns) {
              if (!newestCompletedRunByWorkflow.has(run.workflow_id)) {
                newestCompletedRunByWorkflow.set(run.workflow_id, run.id);
              }
            }

            const staleRuns = completedRuns.filter(
              (run) => newestCompletedRunByWorkflow.get(run.workflow_id) !== run.id,
            );

            for (const run of staleRuns) {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
            }

            core.notice(`Deleted ${staleRuns.length} old site workflow run(s).`);
